const KEY='lughati_evening_v2';
let db;try{db=JSON.parse(localStorage.getItem(KEY))||{students:[],current:'',scores:{},attendance:{},custom:{words:[],sentences:[],texts:[]}}}catch(e){db={students:[],current:'',scores:{},attendance:{},custom:{words:[],sentences:[],texts:[]}}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('تعذر الحفظ على هذا المتصفح. استخدمي تصدير النسخة الاحتياطية.')}};
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tabs=[['home','🏠 الرئيسية'],['students','👧 إدارة الطلاب'],['letters','🔤 الحروف والأصوات'],['words','📚 الكلمات'],['sentences','📝 الجمل'],['texts','📖 النصوص والقصص'],['syllables','🚦 المقاطع الساكنة'],['games','🧩 الألعاب'],['treasure','🎁 الكنز والنجوم'],['follow','📋 المتابعة'],['content','➕ إضافة المحتوى']];let tab='home',idx=0,letter='س',gameIndex=0,selected='',answered=false;
function all(type){return [...initial[type],...(db.custom?.[type]||[])]}
function current(){return db.current||''}function score(){return db.scores[current()]||0}function award(n=1){if(!current()){alert('اختاري طالبًا من إدارة الطلاب أولًا');return}db.scores[current()]=(db.scores[current()]||0)+n;save();const s=$('scoreline');if(s)s.textContent='⭐ رصيد النجوم: '+score()}
function shell(content){$('nav').innerHTML=tabs.map(([k,n])=>`<button class="${tab===k?'active':''}" onclick="go('${k}')">${n}</button>`).join('');$('view').innerHTML=`<div class="panel no-print"><div class="row"><span>👤 الطالب الحالي: <b>${esc(current()||'لم يُحدد')}</b></span><span id="scoreline" class="gold">⭐ رصيد النجوم: ${score()}</span></div></div>${content}`}
function go(k){tab=k;idx=0;selected='';answered=false;render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){let h='';if(tab==='home')h=`<section class="panel"><h2>مرحبًا بك في عالم لغتي! 💜</h2><p>اختاري قسمًا للتعلّم واللعب. الحروف والأصوات والكلمات والجمل والنصوص متاحة من البداية، وتُسجّل النجوم للطالب المختار.</p><div class="grid">${tabs.slice(2).map(([k,n])=>`<div class="tile" onclick="go('${k}')"><strong>${n}</strong><small>اضغطي للدخول ✨</small></div>`).join('')}</div></section><section class="panel"><b>محتوى البداية:</b> ٢٨ حرفًا، ${all('words').length} كلمة، ${all('sentences').length} جملة، ${all('texts').length} نصًا تدريبيًا. <p class="muted mini">النصوص التدريبية الأولية قابلة للتعديل والإضافة، وليست قصصًا أدبية مكتملة أو بديلًا عن المحتوى المعتمد.</p></section>`;
if(tab==='students')h=`<section class="panel"><h2>👧 إدارة الطلاب</h2><p>اكتبي أسماء الطلاب مرة واحدة، كل اسم في سطر مستقل.</p><textarea id="names" placeholder="اسم الطالب الأول&#10;اسم الطالب الثاني"></textarea><div class="row"><button onclick="addStudents()">إضافة جميع الطلاب</button><button onclick="backup()">⬇ حفظ نسخة احتياطية</button><label class="choice" style="padding:10px;border-radius:13px;cursor:pointer">⬆ استيراد نسخة <input type="file" accept=".json" style="display:none" onchange="restore(this)"></label></div><hr class="sep"><h3>الطلاب المسجلون (${db.students.length})</h3><div class="grid">${db.students.map(n=>`<div class="tile"><b>${esc(n)}</b><p class="gold">⭐ ${db.scores[n]||0}</p><button onclick="choose('${encodeURIComponent(n)}')">اختيار</button> <button style="background:#b96785" onclick="removeStudent('${encodeURIComponent(n)}')">حذف</button></div>`).join('')}</div></section>`;
if(tab==='letters')h=`<section class="panel"><h2>🔤 الحروف وأشكالها وأصواتها</h2><div class="letters">${initial.letters.map(l=>`<button onclick="pickLetter('${l}')">${l}</button>`).join('')}</div><hr class="sep"><div class="big">${letter}</div><p style="text-align:center">أول الكلمة: <b>${letter}ـ</b> &nbsp; وسط الكلمة: <b>ـ${letter}ـ</b> &nbsp; آخر الكلمة: <b>ـ${letter}</b></p><div class="grid">${['َ','ُ','ِ','ْ','ا','و','ي'].map((m,i)=>`<div class="tile"><div class="big">${letter}${m}</div><small>${['فتحة','ضمة','كسرة','سكون','مد بالألف','مد بالواو','مد بالياء'][i]}</small></div>`).join('')}</div><p class="warn">اقرئي الأصوات مع الطلاب قراءة بشرية صحيحة؛ هذه النسخة لا تولّد نطقًا آليًا.</p><button onclick="award()">⭐ إتقان وتسجيل نجمة</button></section>`;
if(tab==='words'||tab==='sentences'){let arr=all(tab);h=`<section class="panel"><h2>${tab==='words'?'📚 قراءة الكلمات':'📝 قراءة الجمل'}</h2><p>يقرأ الطالب بنفسه دون صوت مساعد.</p><div class="row"><button onclick="step(-1)">السابق</button><span class="chip">${idx+1} / ${arr.length}</span><button onclick="step(1)">التالي</button></div><div class="big">${esc(arr[idx]||'')}</div><button onclick="award()">⭐ قرأ بإتقان</button><hr class="sep"><div class="grid">${arr.slice(Math.max(0,idx-2),idx+10).map((w,i)=>`<div class="tile" onclick="idx=${Math.max(0,idx-2)+i};render()">${esc(w)}</div>`).join('')}</div></section>`}
if(tab==='texts'){let arr=all('texts'),t=arr[idx]||{};h=`<section class="panel"><h2>📖 النصوص والقصص (${arr.length})</h2><div class="row"><button onclick="step(-1)">السابق</button><select onchange="idx=+this.value;render()">${arr.map((v,i)=>`<option value="${i}" ${i===idx?'selected':''}>${esc(v.title)}</option>`).join('')}</select><button onclick="step(1)">التالي</button></div><h2 style="text-align:center">${esc(t.title)}</h2><div class="cardtext">${esc(t.body)}</div><h3>سؤال فهم قرائي</h3><p>${esc(t.question||'ما الفكرة الأساسية في النص؟')}</p><textarea id="reply" placeholder="إجابة الطالب أو ملاحظات المعلمة"></textarea><button onclick="award(2)">⭐ إتقان النص (+٢)</button></section>`}
if(tab==='syllables'){let examples=['مَدْ','بَحْ','نَمْ','قَلْ','شَمْ','رَسْ','يَكْ','يَذْ','يَفْ','عِنْ','مِنْ','لَمْ','هَلْ','قُمْ','صُمْ','كُنْ','لَنْ','أَنْ','بَلْ','قَدْ'];h=`<section class="panel"><h2>🚦 المقاطع الساكنة</h2><p>توقّف عند السكون، واقرأ المقطع كوحدة صوتية.</p><div class="grid">${examples.map(w=>`<div class="tile"><div class="big">${w}</div><button onclick="award()">⭐ أتقن</button></div>`).join('')}</div></section>`}
if(tab==='games')h=gameView();
if(tab==='treasure')h=`<section class="panel" style="text-align:center"><h2>🎁 صندوق الكنز القرائي</h2><div style="font-size:90px">${score()>=5?'🎉':'🎁'}</div><p class="score">${score()} ⭐</p><p>كل ٥ نجوم تفتح كنزًا جديدًا!</p><p>${score()>=5?'أحسنت! لقد فتحت '+Math.floor(score()/5)+' كنزًا 🎊':'باقي '+(5-score()%5)+' نجوم للكنز القادم!'}</p><button onclick="award()">⭐ نجمة تشجيعية من المعلمة</button><hr class="sep"><h3>🏅 شهادة إنجاز</h3><p>تشهد الأستاذة الهنوف الشهري بإنجاز الطالب/ة <b>${esc(current()||'................')}</b> في أنشطة التعليم المسائي لمادة لغتي.</p><button onclick="window.print()">🖨 طباعة الشهادة</button></section>`;
if(tab==='follow')h=`<section class="panel"><h2>📋 متابعة الحصص المسائية – مادة لغتي</h2><p>الأستاذة الهنوف الشهري • الصف الأول • الأحد والثلاثاء</p><p>اختاري الطالب من إدارة الطلاب أولًا.</p><div class="row"><label>الأسبوع <input id="week" type="number" min="1" max="52" value="1" style="width:80px"></label><label>اليوم <select id="day"><option>الأحد</option><option>الثلاثاء</option></select></label></div><div class="row" style="margin:15px 0"><label>الحضور <select id="presence"><option>حاضر</option><option>غائب</option></select></label><label>القراءة <select id="reading"><option>متقن</option><option>في تقدم</option><option>يحتاج دعمًا</option></select></label><label>الكتابة <select id="writing"><option>متقن</option><option>في تقدم</option><option>يحتاج دعمًا</option></select></label><label>الإملاء <select id="dictation"><option>متقن</option><option>في تقدم</option><option>يحتاج دعمًا</option></select></label></div><textarea id="note" placeholder="ملاحظة المعلمة والتدريب المنزلي المقترح"></textarea><div class="row"><button onclick="saveFollow()">💾 حفظ المتابعة</button><button onclick="report()">📋 نسخ تقرير الأسرة</button></div><hr class="sep"><h3>سجل المتابعات</h3><div id="history">${historyHTML()}</div></section>`;
if(tab==='content')h=`<section class="panel"><h2>➕ مكتبة المحتوى الخاصة بك</h2><p>أضيفي عشرات الكلمات والجمل دفعة واحدة، كل عنصر في سطر. ولإضافة نص، اكتبي عنوانه ومحتواه في الحقول المخصصة.</p><label>نوع المحتوى <select id="kind"><option value="words">كلمات</option><option value="sentences">جمل</option><option value="texts">نصوص وقصص</option></select></label><p>عنوان النص (للنصوص فقط)</p><input id="ctitle" placeholder="عنوان النص"><p>الكلمات أو الجمل (كل عنصر في سطر) أو نص القصة كاملًا</p><textarea id="cbody"></textarea><button onclick="addContent()">➕ إضافة إلى المكتبة</button><p class="warn">المحتوى محفوظ محليًا في هذا المتصفح؛ احفظي نسخة احتياطية من قسم إدارة الطلاب.</p></section>`;
shell(h)}
function step(d){let n=all(tab).length;idx=Math.max(0,Math.min(n-1,idx+d));render()}function pickLetter(l){letter=l;render()}
function addStudents(){let names=$('names').value.split(/[\n،,]+/).map(s=>s.trim()).filter(Boolean);db.students=[...new Set([...db.students,...names])];if(!db.current)db.current=db.students[0]||'';save();render()}
function choose(n){db.current=decodeURIComponent(n);save();render()}function removeStudent(n){n=decodeURIComponent(n);if(!confirm('حذف الطالب '+n+' من القائمة؟'))return;db.students=db.students.filter(x=>x!==n);if(db.current===n)db.current=db.students[0]||'';save();render()}
function gameView(){let w=['باب','قلم','نمر','ورد','شمس','قمر','علم','كتب','درس','رسم'][gameIndex%10];let chars=[...w],missing=gameIndex%chars.length,options=[chars[missing],...initial.letters.filter(x=>x!==chars[missing]).slice(gameIndex%10,gameIndex%10+3)].sort(()=>Math.random()-.5);return `<section class="panel"><h2>🧩 ألعاب لغتي التفاعلية</h2><div class="row"><button onclick="newGame()">🔄 لعبة جديدة</button><span class="chip">تحدي ${gameIndex+1}</span></div><h3>ما الحرف الناقص؟</h3><div class="big">${chars.map((c,i)=>i===missing?'□':c).join(' ')}</div><div style="text-align:center">${options.map(c=>`<button class="choice" onclick="checkLetter('${c}','${chars[missing]}')">${c}</button>`).join('')}</div><div id="feedback" class="message">اختاري الحرف الصحيح.</div><hr class="sep"><h3>ترتيب الكلمة – سحب وإفلات أو لمس</h3><p>اختاري الحروف بالترتيب. اللمس يعمل على الآيفون والآيباد.</p><div id="built" class="big">${esc(selected)||'＿ ＿ ＿'}</div><div class="row">${[...chars].reverse().map((c,i)=>`<button class="choice" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${c}')" onclick="appendLetter('${c}')">${c}</button>`).join('')}</div><div class="row" style="margin-top:12px"><button onclick="selected='';render()">مسح</button><button onclick="verifyWord('${w}')">تحقق من الكلمة</button></div></section>`}
function newGame(){gameIndex++;selected='';answered=false;render()}function checkLetter(c,expected){if(answered)return;if(c===expected){answered=true;$('feedback').textContent='أحسنت! إجابة صحيحة ⭐';award()}else $('feedback').textContent='حاول مرة أخرى 💜'}function appendLetter(c){selected+=c;$('built').textContent=selected}function verifyWord(w){if(selected===w){alert('رائع! رتبت الكلمة بنجاح ⭐');award(2);newGame()}else alert('حاول مرة أخرى، يمكنك مسح الحروف وإعادة ترتيبها')}
function addContent(){let kind=$('kind').value,body=$('cbody').value.trim();if(!body)return alert('اكتبي المحتوى أولًا');db.custom??={words:[],sentences:[],texts:[]};if(kind==='texts')db.custom.texts.push({title:$('ctitle').value.trim()||'نص جديد',body,question:'ما الفكرة الأساسية في النص؟'});else db.custom[kind].push(...body.split('\n').map(s=>s.trim()).filter(Boolean));save();alert('تمت الإضافة بنجاح');render()}
function historyHTML(){let entries=db.attendance[current()]||[];return entries.slice().reverse().map(e=>`<div class="message"><b>الأسبوع ${esc(e.week)} – ${esc(e.day)}</b> | ${esc(e.presence)} | القراءة: ${esc(e.reading)} | الكتابة: ${esc(e.writing)} | الإملاء: ${esc(e.dictation)}<p>${esc(e.note)}</p></div>`).join('')||'<p class="muted">لا توجد متابعات محفوظة بعد.</p>'}
function saveFollow(){if(!current())return alert('اختاري طالبًا أولًا');let e={week:$('week').value,day:$('day').value,presence:$('presence').value,reading:$('reading').value,writing:$('writing').value,dictation:$('dictation').value,note:$('note').value};db.attendance[current()]??=[];db.attendance[current()].push(e);save();render();alert('تم حفظ المتابعة')}
function report(){let entries=db.attendance[current()]||[];if(!entries.length)return alert('سجلي متابعة الطالب أولًا');let e=entries.at(-1),s=`متابعة الطالب في الحصص المسائية لمادة لغتي – الصف الأول\nالطالب/ة: ${current()}\nالأسبوع: ${e.week} – ${e.day}\nالحضور: ${e.presence}\nالقراءة: ${e.reading}\nالكتابة: ${e.writing}\nالإملاء: ${e.dictation}\nملاحظة المعلمة: ${e.note||'لا توجد'}\nالأستاذة الهنوف الشهري`;navigator.clipboard?.writeText(s).then(()=>alert('تم نسخ التقرير، الصقيه في واتساب')).catch(()=>prompt('انسخي التقرير:',s))||prompt('انسخي التقرير:',s)}
function backup(){let a=document.createElement('a'),blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='نسخة-لغتي-المسائية.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restore(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let obj=JSON.parse(r.result);if(!Array.isArray(obj.students))throw Error();if(confirm('استبدال البيانات الحالية بالنسخة المستوردة؟')){db=obj;save();render()}}catch(e){alert('ملف النسخة الاحتياطية غير صالح')}};r.readAsText(f)}
render();
</script></body></html>
